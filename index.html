<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rome to Venice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#F5F7F9" />
  <!-- Preload the font (immutable, cache-first) to flatten the critical chain.
       itinerary.json is deliberately NOT preloaded: the preloaded response was
       being satisfied from the HTTP cache (GitHub Pages max-age=600) and reused
       before the request reached the service worker, so stale-while-revalidate
       never ran and DATA_UPDATED never fired. The data is small and the SW
       serves it from its own cache anyway. -->
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <header>
    <nav id="day-nav" aria-label="Days"></nav>
    <div id="day-header"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
